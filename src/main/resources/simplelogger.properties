# Настройка логов (slf4j-simple)
org.slf4j.simpleLogger.defaultLogLevel=info

# Hibernate и Hibernate Validator на уровне INFO печатают только справочную информацию
# (версия, параметры базы, "No JTA platform available"), поэтому оставляем предупреждения и ошибки
org.slf4j.simpleLogger.log.org.hibernate=warn
