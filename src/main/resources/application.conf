# Настройки кешей Caffeine (JCache). Имя блока - имя региона кеша Hibernate.
caffeine.jcache {
  # результаты кешируемых запросов: ключ - запрос с параметрами, поэтому размер ограничиваем
  "default-query-results-region" {
    policy {
      maximum.size = 1000
      eager-expiration.after-write = 1h
    }
  }
}
